<style>
:root{--bg:#f5f5f7;--surface:#fff;--surface2:#f5f5f7;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);--text:#1d1d1f;--text2:#6e6e73;--text3:#aeaeb2;--green:#1d9e75;--green-bg:#e8f7f1;--green-text:#085041;--red:#e24b4a;--red-bg:#fef0f0;--red-text:#8b1a1a;--blue:#378add;--blue-bg:#e6f1fb;--blue-text:#0c447c;--orange:#e8a020;--orange-bg:#fef4e0;--orange-text:#7a4500;--accent:#1d1d1f;--r-sm:10px;--r:16px;--r-lg:20px;--font:'DM Sans',-apple-system,sans-serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
.app{max-width:860px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0 14px;position:sticky;top:0;background:var(--bg);z-index:200;gap:10px}
.nav-left{display:flex;align-items:center;gap:8px}
.nav-icon{width:28px;height:28px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center}
.nav-icon svg{width:16px;height:16px;fill:#fff}
.nav-title{font-size:16px;font-weight:600;letter-spacing:-.3px}
.nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pill{display:flex;align-items:center;gap:5px;background:var(--surface);border:.5px solid var(--border2);border-radius:20px;padding:5px 10px 5px 8px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:.15s;white-space:nowrap}
.pill:active{transform:scale(.96)}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--text3);transition:.3s}
.dot-live.on{background:var(--green)}
.tabs{display:flex;gap:0;background:var(--surface);border-radius:12px;border:.5px solid var(--border);overflow:hidden;margin-bottom:14px}
.tab-btn{flex:1;padding:9px 6px;font-size:12px;font-weight:500;color:var(--text2);background:transparent;border:none;cursor:pointer;transition:.15s;white-space:nowrap}
.tab-btn.active{background:var(--accent);color:#fff}
.chips-wrap{margin-bottom:12px}
.chips-label{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:20px;border:.5px solid var(--border2);background:var(--surface);font-size:12px;font-weight:500;color:var(--text);cursor:pointer;transition:.15s;white-space:nowrap}
.chip:active{transform:scale(.95)}
.chip .cdot{width:5px;height:5px;border-radius:50%}
.chip.us .cdot{background:var(--blue)}
.chip.tw .cdot{background:var(--green)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.active.us{background:#042C53;border-color:#042C53}
.chip.active.tw{background:#085041;border-color:#085041}
.chip.active .cdot{background:rgba(255,255,255,.5)}
.cmp-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12px;color:var(--text2)}
.toggle{width:36px;height:20px;background:var(--border2);border-radius:10px;cursor:pointer;position:relative;transition:.2s;flex-shrink:0}
.toggle.on{background:var(--green)}
.toggle::after{content:'';width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{left:18px}
.cards{display:grid;gap:14px;grid-template-columns:1fr}
.cards.dual{grid-template-columns:1fr 1fr}
@media(max-width:600px){.cards.dual{grid-template-columns:1fr}}
.card{background:var(--surface);border-radius:var(--r-lg);border:.5px solid var(--border);overflow:hidden;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.c-head{padding:16px 18px 12px;border-bottom:.5px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between}
.c-name{font-size:17px;font-weight:600;letter-spacing:-.4px}
.c-ticker{font-size:11px;color:var(--text2);margin-top:2px;font-family:var(--mono)}
.badge{font-size:10px;font-weight:600;letter-spacing:.4px;padding:3px 8px;border-radius:6px}
.badge.us{background:var(--blue-bg);color:var(--blue-text)}
.badge.tw{background:var(--green-bg);color:var(--green-text)}
.price-row{padding:12px 18px;border-bottom:.5px solid var(--border)}
.live-price{font-size:26px;font-weight:600;letter-spacing:-.8px;font-family:var(--mono)}
.price-chg{font-size:13px;font-weight:500}
.price-chg.up{color:var(--green)}.price-chg.dn{color:var(--red)}
.price-loading{font-size:13px;color:var(--text3)}
.signal{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.signal.cheap{background:var(--green-bg);color:var(--green-text)}
.signal.fair{background:var(--orange-bg);color:var(--orange-text)}
.signal.expensive{background:var(--red-bg);color:var(--red-text)}
.signal.watch{background:#f0f0f0;color:var(--text2)}
.sec{padding:12px 18px;border-bottom:.5px solid var(--border)}
.sec:last-child{border-bottom:none}
.sec-t{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.row-l{font-size:13px;color:var(--text2)}
.row-v{font-size:13px;font-weight:500;font-family:var(--mono)}
.row-v.g{color:var(--green)}.row-v.r{color:var(--red)}
.note{font-size:10px;color:var(--text3);margin-top:5px;line-height:1.4}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:7px}
.mcell{background:var(--surface2);border-radius:8px;padding:7px 9px}
.mcell .mm{font-size:10px;color:var(--text3);margin-bottom:2px;font-weight:500}
.mcell .mv{font-size:12px;font-weight:600;font-family:var(--mono)}
.total-bar{background:var(--green-bg);border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.total-bar .tl{font-size:12px;color:var(--green-text);font-weight:500}
.total-bar .tv{font-size:14px;font-weight:700;color:var(--green-text);font-family:var(--mono)}
.eps-bar-wrap{display:flex;align-items:flex-end;gap:4px;height:70px;margin:4px 0 6px}
.eps-bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.eps-bf{width:100%;border-radius:3px 3px 0 0;min-height:3px;transition:.3s;background:var(--green)}
.eps-bf.proj{background:var(--blue);opacity:.7}
.eps-bf.proj2{background:var(--orange);opacity:.7}
.eps-by{font-size:9px;color:var(--text3)}
.eps-bv{font-size:9px;font-weight:600;color:var(--text2);font-family:var(--mono)}
.pe-tbl{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.pe-tbl th{font-size:10px;font-weight:600;color:var(--text3);padding:5px 8px;text-align:right;border-bottom:.5px solid var(--border);letter-spacing:.3px}
.pe-tbl th:first-child{text-align:left}
.pe-tbl td{padding:5px 8px;text-align:right;border-bottom:.5px solid var(--bg);font-family:var(--mono)}
.pe-tbl td:first-child{text-align:left;font-family:var(--font);color:var(--text2)}
.pe-tbl tr:last-child td{border-bottom:none}
.pe-tbl .hi{background:var(--green-bg)}
.pe-tbl .hi td{color:var(--green-text)!important;font-weight:600}
.pe-tbl .cur{background:var(--orange-bg)}
.pe-tbl .cur td{color:var(--orange-text)!important}
.calc-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calc-row label{font-size:12px;color:var(--text2);width:38px;flex-shrink:0}
.calc-row input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--border2);outline:none}
.calc-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.calc-val{font-size:12px;font-weight:600;min-width:52px;text-align:right;font-family:var(--mono)}
.target-box{background:var(--accent);border-radius:10px;padding:14px;text-align:center;margin-top:6px}
.target-box .tl{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.target-box .tv{font-size:26px;font-weight:600;color:#fff;letter-spacing:-.8px;font-family:var(--mono)}
.target-box .tn{font-size:10px;color:rgba(255,255,255,.4);margin-top:3px}
.news-item{padding:9px 0;border-bottom:.5px solid var(--bg);cursor:pointer}
.news-item:last-child{border-bottom:none}
.news-headline{font-size:13px;font-weight:500;line-height:1.4;margin-bottom:3px}
.news-meta{font-size:10px;color:var(--text3);display:flex;gap:8px;flex-wrap:wrap}
.news-sent{padding:1px 6px;border-radius:4px;font-size:9px;font-weight:600}
.news-sent.pos{background:var(--green-bg);color:var(--green-text)}
.news-sent.neg{background:var(--red-bg);color:var(--red-text)}
.news-sent.neu{background:var(--surface2);color:var(--text3)}
.port-section{padding:16px}
.port-add-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.port-select{flex:1;min-width:100px;padding:8px 10px;border-radius:10px;border:.5px solid var(--border2);background:var(--surface);font-size:13px;font-family:var(--font);color:var(--text);outline:none}

.port-detail{font-size:11px;color:var(--text2);margin-top:2px}
.port-pnl{font-size:15px;font-weight:600;font-family:var(--mono)}
.port-pnl.pos{color:var(--green)}.port-pnl.neg{color:var(--red)}

.port-pnl-pct.pos{color:var(--green)}.port-pnl-pct.neg{color:var(--red)}

.port-total-v{font-size:14px;font-weight:600;font-family:var(--mono)}
.alert-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:.5px solid var(--bg)}

.alert-name{font-size:13px;font-weight:500}
.alert-price{font-size:11px;color:var(--text2);margin-top:1px;font-family:var(--mono)}
.alert-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px}
.triggered{color:var(--red)!important}
.empty-state{text-align:center;padding:50px 20px;color:var(--text3)}
.empty-icon{font-size:36px;margin-bottom:10px}
.disclaimer{margin-top:18px;font-size:10px;color:var(--text3);text-align:center;line-height:1.6;padding:0 8px}
</style>
</head>

async function fetchRate(){
  const pill=document.getElementById('rate-pill'),dot=document.getElementById('rate-dot'),txt=document.getElementById('rate-txt');
  pill.style.opacity='0.6';
  try{
    const r=await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');
    if(!r.ok)throw new Error();
    const d=await r.json();usdTwd=d.usd?.twd||USD_TWD_FALLBACK;
    txt.textContent='1 USD = NT$'+usdTwd.toFixed(2);dot.className='dot-live on';
  }catch{usdTwd=USD_TWD_FALLBACK;txt.textContent='NT$'+USD_TWD_FALLBACK;dot.className='dot-live';}
  pill.style.opacity='1';
}

async function fetchPriceTW(ticker){
  const isTWO=ticker.endsWith('.TWO');
  const code=isTWO?ticker.replace('.TWO',''):ticker.replace('.TW','');
  if(!isTWO){try{const r=await fetch(`https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_${code}.tw&json=1&delay=0`);if(!r.ok)throw new Error();const d=await r.json();const info=d?.msgArray?.[0];if(!info||!info.z||info.z==='-')throw new Error();const price=parseFloat(info.z);const prev=parseFloat(info.y)||price;return{price,change:price-prev,changePct:prev?(price-prev)/prev*100:0,prevClose:prev};}catch{}}
  if(isTWO){try{const r=await fetch(`https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes?stockNo=${code}`);if(!r.ok)throw new Error();const d=await r.json();const info=d?.[0];if(!info)throw new Error();const price=parseFloat(info.ClosingPrice||info.LatestPrice);const prev=parseFloat(info.PreviousClose)||price;if(!price)throw new Error();return{price,change:price-prev,changePct:prev?(price-prev)/prev*100:0,prevClose:prev};}catch{}}
  try{const sym=encodeURIComponent(ticker);const r=await fetch(`https://corsproxy.io/?https://query2.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=1d`);if(!r.ok)throw new Error();const d=await r.json();const meta=d?.chart?.result?.[0]?.meta;if(!meta?.regularMarketPrice)throw new Error();const price=meta.regularMarketPrice;const prev=meta.chartPreviousClose||meta.previousClose||price;return{price,change:price-prev,changePct:prev?(price-prev)/prev*100:0,prevClose:prev};}catch{}
  return null;
}

async function fetchPriceUS(ticker){
  if(!FINNHUB_KEY||FINNHUB_KEY.length<10)return null;
  try{const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(ticker)}&token=${FINNHUB_KEY}`);if(!r.ok)throw new Error();const d=await r.json();if(!d.c)throw new Error();return{price:d.c,change:d.d,changePct:d.dp,prevClose:d.pc};}catch{return null;}
}

async function fetchPrice(ticker,market){
  const now=Date.now();
  if(priceCache[ticker]&&now-priceCache[ticker].ts<60000)return priceCache[ticker].data;
  const result=market==='tw'?await fetchPriceTW(ticker):await fetchPriceUS(ticker);
  if(result)priceCache[ticker]={data:result,ts:now};
  return result;
}

function getSignal(id,price){
  const c=COMPANIES[id];const bearEps=c.eps2026_bear;
  if(!price||!bearEps)return null;
  const livePe=price/bearEps;const peAvg=c.data2025.peAvg;
  const maxP=c.data2025.maxPrice2025_twd||((c.data2025.maxPrice2025_usd||0)*usdTwd);
  const drop=maxP?(price-maxP)/maxP*100:0;
  const val=livePe<peAvg*0.85?'cheap':livePe>peAvg*1.15?'expensive':'fair';
  const dropSignal=drop<=-20?{msg:`距高點跌 ${Math.abs(drop).toFixed(0)}%`}:null;
  return{livePe,val,dropSignal};
}

      <div class="note">${d.note}</div></div>
    <div class="sec"><div class="sec-t">歷年 EPS 走勢</div>
      <div class="eps-bar-wrap">${chartHtml}</div>

    <div class="sec"><div class="sec-t">2026 Q1 月度營收</div>${monthHtml}${totalHtml}
      <div style="background:var(--surface2);border-radius:8px;padding:8px 12px;margin-top:6px;display:flex;justify-content:space-between;align-items:flex-start">

function recalc(uid){
  const eps=parseFloat(document.getElementById('sl-eps-'+uid).value)||0;
  const pe=parseFloat(document.getElementById('sl-pe-'+uid).value)||0;
  document.getElementById('vl-eps-'+uid).textContent=fmtNT(eps);
  document.getElementById('vl-pe-'+uid).textContent=pe+'x';
  document.getElementById('tgt-'+uid).textContent=fmtNT(Math.round(eps*pe));
}

async function updateCardPrice(id){
  const c=COMPANIES[id];const el=document.getElementById('price-block-'+id);if(!el)return;
  const pd=await fetchPrice(c.ticker,c.market);
  if(!pd){el.innerHTML='<span class="price-loading">股價暫時無法取得，請點更新重試</span>';return;}
  const isUS=c.market==='us';const twdP=isUS?pd.price*usdTwd:pd.price;
  const chg=pd.changePct||0;const chgStr=(chg>=0?'+':'')+chg.toFixed(2)+'%';const cls=chg>=0?'up':'dn';
  const sig=getSignal(id,twdP);
  let sigHtml='';
  if(sig){
    sigHtml+=sig.val==='cheap'?`<span class="signal cheap">💚 便宜 PE ${sig.livePe.toFixed(1)}x</span>`:sig.val==='expensive'?`<span class="signal expensive">🔴 偏貴 PE ${sig.livePe.toFixed(1)}x</span>`:`<span class="signal fair">🟡 合理 PE ${sig.livePe.toFixed(1)}x</span>`;
    if(sig.dropSignal)sigHtml+=` <span class="signal watch">⚠️ ${sig.dropSignal.msg}</span>`;
  }
  let html=`<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="live-price">${fmtNT(twdP,0)}</span>`;
  if(isUS)html+=`<span style="font-size:11px;color:var(--text3)">(${fmtUSD(pd.price)})</span>`;
  html+=`<span class="price-chg ${cls}">${chgStr}</span></div>`;
  if(sigHtml)html+=`<div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap">${sigHtml}</div>`;
  el.innerHTML=html;
  const bearEps=c.eps2026_bear;
  if(bearEps){const livePe=twdP/bearEps;c.peRows.forEach(pe=>{const row=document.getElementById(`pe-row-${id}-${pe}`);if(!row)return;Math.abs(pe-livePe)<2.5?row.classList.add('cur'):row.classList.remove('cur');});}
  checkAlerts(id,twdP);
}

async function addHolding(){
  const id=document.getElementById('p-stock').value;const shares=parseFloat(document.getElementById('p-shares').value);const cost=parseFloat(document.getElementById('p-cost').value);
  if(!id||!shares||!cost)return alert('請填寫所有欄位');
  const p=getPortfolio();p.push({id,shares,cost,addedAt:Date.now()});savePortfolio(p);
  document.getElementById('p-shares').value='';document.getElementById('p-cost').value='';renderPortfolio();
}
async function renderPortfolio(){
  const p=getPortfolio();const list=document.getElementById('holdings-list');const summary=document.getElementById('port-summary');
  if(!p.length){list.innerHTML='<div style="text-align:center;padding:30px;color:var(--text3);font-size:13px">尚無持股，從上方新增</div>';summary.innerHTML='';return;}
  let totalCost=0,totalVal=0;
  const rows=await Promise.all(p.map(async(h,i)=>{
    const c=COMPANIES[h.id];if(!c)return'';
    const pd=await fetchPrice(c.ticker,c.market);const isUS=c.market==='us';
    const curP=pd?(isUS?pd.price*usdTwd:pd.price):null;
    const costT=h.shares*h.cost;const valT=curP?h.shares*curP:null;const pnl=valT!=null?valT-costT:null;const pnlPct=pnl!=null?pnl/costT*100:null;
    if(costT)totalCost+=costT;if(valT)totalVal+=valT;
    const pnlHtml=pnl!=null?`<div class="port-pnl ${pnl>=0?'pos':'neg'}">${pnl>=0?'+':''}${fmtNT(pnl,0)}</div><div class="port-pnl-pct ${pnl>=0?'pos':'neg'}">${pnlPct>=0?'+':''}${pnlPct.toFixed(1)}%</div>`:'<div class="port-pnl" style="color:var(--text3)">—</div>';
    return`<div class="port-card"><div><div class="port-name">${c.name}</div><div class="port-detail">${fmtNum(h.shares)}股 × 成本${fmtNT(h.cost,0)} = ${fmtNT(costT,0)}</div>${curP?`<div class="port-detail">現價 ${fmtNT(curP,0)}</div>`:''}</div><div style="display:flex;align-items:center;gap:8px"><div style="text-align:right">${pnlHtml}</div><button class="port-del" onclick="removeHolding(${i})">✕</button></div></div>`;
  }));
  list.innerHTML=rows.join('');
  const totalPnl=totalVal-totalCost;const totalPct=totalCost?totalPnl/totalCost*100:0;
  summary.innerHTML=totalCost?`<div class="port-total"><div><div class="port-total-l">總成本</div><div class="port-total-v">${fmtNT(totalCost,0)}</div></div><div><div class="port-total-l">現值</div><div class="port-total-v">${fmtNT(totalVal,0)}</div></div><div><div class="port-total-l">損益</div><div class="port-total-v" style="color:${totalPnl>=0?'var(--green)':'var(--red)'}">${totalPnl>=0?'+':''}${fmtNT(totalPnl,0)}<br><span style="font-size:11px">${totalPct>=0?'+':''}${totalPct.toFixed(1)}%</span></div></div></div>`:'';
}
function removeHolding(i){const p=getPortfolio();p.splice(i,1);savePortfolio(p);renderPortfolio();}

  const a=getAlerts();const list=document.getElementById('alerts-list');
  if(!a.length){list.innerHTML='<div style="text-align:center;padding:30px;color:var(--text3);font-size:13px">尚無警示設定</div>';return;}
  list.innerHTML=a.map((al,i)=>{const c=COMPANIES[al.id];const dirL=al.dir==='below'?'跌破':'突破';return`<div class="alert-item"><div style="flex:1"><div class="alert-name${al.triggered?' triggered':''}">${c?.name||al.id}${al.triggered?' 🔔 已觸發':''}</div><div class="alert-price">${dirL} ${fmtNT(al.price,0)}</div></div><button class="alert-del" onclick="removeAlert(${i})">✕</button></div>`;}).join('');
}
function removeAlert(i){const a=getAlerts();a.splice(i,1);saveAlerts(a);renderAlerts();}
function checkAlerts(id,price){
  const a=getAlerts();let changed=false;
  a.forEach(al=>{if(al.id!==id||al.triggered)return;if(al.dir==='below'&&price<=al.price){al.triggered=true;changed=true;showToast(`🔔 ${COMPANIES[id]?.name} 已跌破 ${fmtNT(al.price,0)}`);}if(al.dir==='above'&&price>=al.price){al.triggered=true;changed=true;showToast(`🔔 ${COMPANIES[id]?.name} 已突破 ${fmtNT(al.price,0)}`); }});
  if(changed){saveAlerts(a);if(currentTab==='alerts')renderAlerts();}
}
function showToast(msg){const t=document.createElement('div');t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.25);white-space:nowrap';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),4000);}

// NEWS
function renderNewsChips(){
  const ct=document.getElementById('news-chips');ct.innerHTML='';
  Object.entries(COMPANIES).forEach(([id,c])=>{const btn=document.createElement('button');btn.className='chip '+c.market+(newsSelected===id?' active':'');btn.innerHTML=`<div class="cdot"></div>${c.name}`;btn.onclick=()=>loadNews(id,btn);ct.appendChild(btn);});
}
async function loadNews(id,btn){
  newsSelected=id;document.querySelectorAll('#news-chips .chip').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  const list=document.getElementById('news-list');list.innerHTML='<div class="empty-state"><div class="empty-icon">⏳</div><div>載入中…</div></div>';
  const c=COMPANIES[id];const ticker=c.market==='tw'?c.ticker.replace('.TW','').replace('.TWO',''):c.ticker;
  try{
    const to=new Date().toISOString().split('T')[0];const from=new Date(Date.now()-7*24*3600*1000).toISOString().split('T')[0];
    const r=await fetch(`https://finnhub.io/api/v1/company-news?symbol=${ticker}&from=${from}&to=${to}&token=${FINNHUB_KEY}`);
    if(!r.ok)throw new Error();const news=await r.json();if(!news.length)throw new Error('no news');
    list.innerHTML=`<div style="padding:0 2px">`+news.slice(0,15).map(n=>{const dt=new Date(n.datetime*1000);const ds=`${dt.getMonth()+1}/${dt.getDate()} ${dt.getHours()}:${String(dt.getMinutes()).padStart(2,'0')}`;const s=n.sentiment==='positive'?'pos':n.sentiment==='negative'?'neg':'neu';const sl=s==='pos'?'利多':s==='neg'?'利空':'中性';return`<div class="news-item" onclick="window.open('${n.url}','_blank')"><div class="news-headline">${n.headline}</div><div class="news-meta"><span>${ds}</span><span>${n.source||''}</span><span class="news-sent ${s}">${sl}</span></div></div>`;}).join('')+'</div>';
  }catch{list.innerHTML=`<div class="empty-state"><div class="empty-icon">📰</div><div style="font-size:12px;line-height:1.6">台股新聞需使用英文代碼查詢。<br>建議切換美股公司（NVDA/AMD/Apple/Meta）查看新聞。</div></div>`;}
}

async function refresh(){
  await fetchRate();
  if(currentTab==='analyze')selected.forEach(id=>updateCardPrice(id));
  else if(currentTab==='portfolio')renderPortfolio();
}

(async()=>{renderPicker();populateStockSelects();await fetchRate();selectCompany('PHISON');})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
