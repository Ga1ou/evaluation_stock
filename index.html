<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="股票估值">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>股票估值</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f7;--surface:#fff;--surface2:#f5f5f7;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);--text:#1d1d1f;--text2:#6e6e73;--text3:#aeaeb2;--green:#1d9e75;--green-bg:#e8f7f1;--green-text:#085041;--red:#e24b4a;--red-bg:#fef0f0;--red-text:#8b1a1a;--blue:#378add;--blue-bg:#e6f1fb;--blue-text:#0c447c;--orange:#e8a020;--orange-bg:#fef4e0;--orange-text:#7a4500;--accent:#1d1d1f;--font:'DM Sans',-apple-system,sans-serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
.app{max-width:900px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom,0px)+32px)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px;position:sticky;top:0;background:var(--bg);z-index:200}
.nav-left{display:flex;align-items:center;gap:8px}
.nav-icon{width:28px;height:28px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center}
.nav-icon svg{width:16px;height:16px;fill:#fff}
.nav-title{font-size:16px;font-weight:600;letter-spacing:-.3px}
.pill{display:flex;align-items:center;gap:5px;background:var(--surface);border:.5px solid var(--border2);border-radius:20px;padding:5px 10px 5px 8px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap}
.pill:active{transform:scale(.96)}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--text3);transition:.3s}
.dot-live.on{background:var(--green)}
.tabs{display:flex;background:var(--surface);border-radius:12px;border:.5px solid var(--border);overflow:hidden;margin-bottom:14px}
.tab-btn{flex:1;padding:9px 4px;font-size:12px;font-weight:500;color:var(--text2);background:transparent;border:none;cursor:pointer;white-space:nowrap}
.tab-btn.active{background:var(--accent);color:#fff}
.chips-wrap{margin-bottom:12px}
.chips-label{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:20px;border:.5px solid var(--border2);background:var(--surface);font-size:12px;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap}
.chip .cdot{width:5px;height:5px;border-radius:50%}
.chip.us .cdot{background:var(--blue)}.chip.tw .cdot{background:var(--green)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.active.us{background:#042C53}.chip.active.tw{background:#085041}
.chip.active .cdot{background:rgba(255,255,255,.5)}
.cmp-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12px;color:var(--text2)}
.toggle{width:36px;height:20px;background:var(--border2);border-radius:10px;cursor:pointer;position:relative;transition:.2s;flex-shrink:0}
.toggle.on{background:var(--green)}
.toggle::after{content:'';width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{left:18px}
.cards{display:grid;gap:14px;grid-template-columns:1fr}
.cards.dual{grid-template-columns:1fr 1fr}
@media(max-width:620px){.cards.dual{grid-template-columns:1fr}}
.card{background:var(--surface);border-radius:20px;border:.5px solid var(--border);overflow:hidden;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.c-head{padding:16px 18px 12px;border-bottom:.5px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between}
.c-name{font-size:17px;font-weight:600;letter-spacing:-.4px}
.c-ticker{font-size:11px;color:var(--text2);margin-top:2px;font-family:var(--mono)}
.badge{font-size:10px;font-weight:600;letter-spacing:.4px;padding:3px 8px;border-radius:6px}
.badge.us{background:var(--blue-bg);color:var(--blue-text)}.badge.tw{background:var(--green-bg);color:var(--green-text)}
.price-row{padding:12px 18px;border-bottom:.5px solid var(--border)}
.live-price{font-size:26px;font-weight:600;letter-spacing:-.8px;font-family:var(--mono)}
.price-chg{font-size:13px;font-weight:500}.price-chg.up{color:var(--green)}.price-chg.dn{color:var(--red)}
.price-loading{font-size:13px;color:var(--text3)}
.signal{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.signal.cheap{background:var(--green-bg);color:var(--green-text)}
.signal.fair{background:var(--orange-bg);color:var(--orange-text)}
.signal.expensive{background:var(--red-bg);color:var(--red-text)}
.signal.watch{background:#f0f0f0;color:var(--text2)}
.sec{padding:12px 18px;border-bottom:.5px solid var(--border)}
.sec:last-child{border-bottom:none}
.sec-t{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.row-l{font-size:13px;color:var(--text2)}.row-v{font-size:13px;font-weight:500;font-family:var(--mono)}
.row-v.g{color:var(--green)}.row-v.r{color:var(--red)}
.note{font-size:10px;color:var(--text3);margin-top:5px;line-height:1.4}
/* chart canvas */
.chart-wrap{position:relative;width:100%;height:220px;margin:4px 0}
canvas{width:100%!important}
/* analyst rating */
.rating-box{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.rating-item{background:var(--surface2);border-radius:8px;padding:8px 10px;text-align:center}
.rating-val{font-size:18px;font-weight:700}
.rating-val.strong-buy{color:var(--green)}.rating-val.buy{color:#5ab85c}.rating-val.hold{color:var(--orange)}.rating-val.sell{color:var(--red)}
.rating-label{font-size:10px;color:var(--text3);margin-top:2px}
.target-range{background:linear-gradient(135deg,var(--green-bg),#f0f9f0);border-radius:10px;padding:10px 14px;margin-bottom:6px}
.target-range-title{font-size:10px;color:var(--green-text);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.target-bars{display:flex;flex-direction:column;gap:4px}
.target-bar-row{display:flex;align-items:center;gap:8px;font-size:12px}
.target-bar-row .tbl{width:36px;color:var(--text2);font-size:11px}
.target-bar-row .tbv{font-family:var(--mono);font-weight:600;min-width:52px;text-align:right}
.target-bar-row .tbv.max{color:var(--green-text)}.target-bar-row .tbv.avg{color:var(--blue-text)}.target-bar-row .tbv.min{color:var(--red-text)}
.target-bar-fill{flex:1;height:6px;background:rgba(0,0,0,.06);border-radius:3px;overflow:hidden}
.target-bar-inner{height:100%;border-radius:3px}
/* monthly grid */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:7px}
.mcell{background:var(--surface2);border-radius:8px;padding:7px 9px}
.mcell .mm{font-size:10px;color:var(--text3);margin-bottom:2px;font-weight:500}
.mcell .mv{font-size:12px;font-weight:600;font-family:var(--mono)}
.total-bar{background:var(--green-bg);border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.total-bar .tl{font-size:12px;color:var(--green-text);font-weight:500}
.total-bar .tv{font-size:14px;font-weight:700;color:var(--green-text);font-family:var(--mono)}
/* EPS chart bars */
.eps-bar-wrap{display:flex;align-items:flex-end;gap:4px;height:80px;margin:4px 0 6px}
.eps-bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.eps-bf{width:100%;border-radius:3px 3px 0 0;min-height:3px;background:var(--green)}
.eps-bf.proj{background:var(--blue);opacity:.7}.eps-bf.proj2{background:var(--orange);opacity:.7}
.eps-by{font-size:9px;color:var(--text3)}.eps-bv{font-size:9px;font-weight:600;color:var(--text2);font-family:var(--mono)}
/* PE table */
.pe-tbl{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.pe-tbl th{font-size:10px;font-weight:600;color:var(--text3);padding:5px 8px;text-align:right;border-bottom:.5px solid var(--border)}
.pe-tbl th:first-child{text-align:left}
.pe-tbl td{padding:5px 8px;text-align:right;border-bottom:.5px solid var(--bg);font-family:var(--mono)}
.pe-tbl td:first-child{text-align:left;font-family:var(--font);color:var(--text2)}
.pe-tbl tr:last-child td{border-bottom:none}
.pe-tbl .hi{background:var(--green-bg)}.pe-tbl .hi td{color:var(--green-text)!important;font-weight:600}
.pe-tbl .cur{background:var(--orange-bg)}.pe-tbl .cur td{color:var(--orange-text)!important}
/* calculator */
.calc-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calc-row label{font-size:12px;color:var(--text2);width:38px;flex-shrink:0}
.calc-row input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--border2);outline:none}
.calc-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.calc-val{font-size:12px;font-weight:600;min-width:56px;text-align:right;font-family:var(--mono)}
.target-box{background:var(--accent);border-radius:10px;padding:14px;text-align:center;margin-top:6px}
.target-box .tl{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.target-box .tv{font-size:26px;font-weight:600;color:#fff;letter-spacing:-.8px;font-family:var(--mono)}
.target-box .tn{font-size:10px;color:rgba(255,255,255,.4);margin-top:3px}
/* news */
.news-item{padding:9px 0;border-bottom:.5px solid var(--bg);cursor:pointer}
.news-item:last-child{border-bottom:none}
.news-headline{font-size:13px;font-weight:500;line-height:1.4;margin-bottom:3px}
.news-meta{font-size:10px;color:var(--text3);display:flex;gap:8px;flex-wrap:wrap}
.news-sent{padding:1px 6px;border-radius:4px;font-size:9px;font-weight:600}
.news-sent.pos{background:var(--green-bg);color:var(--green-text)}
.news-sent.neg{background:var(--red-bg);color:var(--red-text)}
.news-sent.neu{background:var(--surface2);color:var(--text3)}
/* portfolio & alerts */
.port-section{padding:16px}
.port-add-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.port-select{flex:1;min-width:100px;padding:8px 10px;border-radius:10px;border:.5px solid var(--border2);background:var(--surface);font-size:13px;font-family:var(--font);color:var(--text);outline:none}
.port-input{width:85px;padding:8px 10px;border-radius:10px;border:.5px solid var(--border2);background:var(--surface);font-size:13px;font-family:var(--mono);color:var(--text);outline:none}
.port-btn{padding:8px 14px;border-radius:10px;background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font)}
.port-btn:active{transform:scale(.97)}
.port-card{background:var(--surface);border-radius:12px;border:.5px solid var(--border);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.port-name{font-size:14px;font-weight:600}
.port-detail{font-size:11px;color:var(--text2);margin-top:2px}
.port-pnl{font-size:15px;font-weight:600;font-family:var(--mono)}
.port-pnl.pos{color:var(--green)}.port-pnl.neg{color:var(--red)}
.port-pnl-pct{font-size:11px}.port-pnl-pct.pos{color:var(--green)}.port-pnl-pct.neg{color:var(--red)}
.port-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:4px}
.port-total{background:var(--surface2);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;margin-top:8px}
.port-total-l{font-size:11px;color:var(--text2);margin-bottom:3px}
.port-total-v{font-size:14px;font-weight:600;font-family:var(--mono)}
.alert-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:.5px solid var(--bg)}
.alert-item:last-child{border-bottom:none}
.alert-name{font-size:13px;font-weight:500}
.alert-price{font-size:11px;color:var(--text2);margin-top:1px;font-family:var(--mono)}
.alert-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px}
.triggered{color:var(--red)!important}
.empty-state{text-align:center;padding:50px 20px;color:var(--text3)}
.empty-icon{font-size:36px;margin-bottom:10px}
.disclaimer{margin-top:18px;font-size:10px;color:var(--text3);text-align:center;line-height:1.6;padding:0 8px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px}
.stat-cell{background:var(--surface2);border-radius:8px;padding:8px 10px}
.stat-cell .sl{font-size:10px;color:var(--text3);margin-bottom:2px}
.stat-cell .sv{font-size:13px;font-weight:600;font-family:var(--mono)}
</style>
</head>

</div>
<div id="tab-portfolio" style="display:none">
  <div class="port-section">
    <div class="sec-t" style="font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);margin-bottom:8px">新增持股</div>

      <select class="port-select" id="p-stock"></select>
      <input class="port-input" id="p-shares" type="number" placeholder="股數" min="1">

      <button class="port-btn" onclick="addHolding()">加入</button>
    </div>
    <div class="sec-t" style="font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);margin-bottom:8px">持股清單</div>
    <div id="holdings-list"></div>
    <div id="port-summary"></div>
  </div>
</div>
<div id="tab-alerts" style="display:none">
  <div class="port-section">
    <div class="sec-t" style="font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);margin-bottom:8px">新增股價警示</div>
    <div class="port-add-row">
      <select class="port-select" id="a-stock"></select>
      <input class="port-input" id="a-price" type="number" placeholder="目標價" min="1">
      <select class="port-select" style="max-width:90px" id="a-dir">
        <option value="below">跌破</option>
        <option value="above">突破</option>
      </select>
      <button class="port-btn" onclick="addAlert()">設定</button>
    </div>
    <div class="sec-t" style="font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);margin-bottom:8px">警示清單</div>
    <div id="alerts-list"></div>
  </div>
</div>
<div id="tab-news" style="display:none">
  <div class="chips-wrap" style="margin-bottom:10px">
    <div class="chips" id="news-chips"></div>
  </div>
  <div id="news-list" style="padding:0 4px">
    <div class="empty-state"><div class="empty-icon">📰</div><div>點選公司載入新聞</div></div>
  </div>
</div>
<div id="tab-game" style="display:none">
  <div class="port-section">
    <div class="sec-t" style="text-align:center; font-size:12px; margin-bottom:12px;">擊退空頭熊市方塊</div>
    <div style="position:relative; width:100%; max-width:400px; margin:0 auto;">
      <canvas id="game-canvas" style="background:#042C53; border-radius:12px; width:100%; height:350px; display:block;"></canvas>
      <div style="text-align:center; margin-top:16px;">
        <button id="game-btn" class="port-btn" onclick="startGame()" style="font-size:15px; padding:10px 24px;">開始遊戲</button>
        <div id="game-score" style="margin-top:10px; font-size:16px; font-weight:600; font-family:var(--mono);">Score: 0</div>
      </div>
    </div>
  </div>
</div>
<div class="disclaimer">資料來源：Finnhub、TWSE、TPEX、公開財報及法人共識。僅供投資參考，不構成買賣建議。</div>

function switchTab(tab,btn){

// PRICE
async function fetchPriceTW(ticker){
  const isTWO=ticker.endsWith('.TWO');
  const code=isTWO?ticker.replace('.TWO',''):ticker.replace('.TW','');

  // Yahoo Finance via corsproxy
  try{
    const sym=encodeURIComponent(ticker);
    const r=await fetch('https://corsproxy.io/?'+encodeURIComponent('https://query2.finance.yahoo.com/v8/finance/chart/'+sym+'?interval=1d&range=1d'));
    const d=await r.json();const meta=d?.chart?.result?.[0]?.meta;
    if(meta?.regularMarketPrice){
      const price=meta.regularMarketPrice,prev=meta.chartPreviousClose||meta.previousClose||price;
      return{price,change:price-prev,changePct:prev?(price-prev)/prev*100:0,prevClose:prev};
    }
  }catch{}

  // TWSE official
  if(!isTWO){
    try{
      const r=await fetch('https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_'+code+'.tw&json=1&delay=0');
      const d=await r.json();const info=d?.msgArray?.[0];
      if(info&&info.z&&info.z!=='-'){
        const price=parseFloat(info.z),prev=parseFloat(info.y)||price;
        return{price,change:price-prev,changePct:(price-prev)/prev*100,prevClose:prev};
      }
    }catch{}
  }

  // TPEX official
  if(isTWO){
    try{
      const r=await fetch('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes?stockNo='+code);
      const d=await r.json();const info=d?.[0];
      if(info){
        const price=parseFloat(info.ClosingPrice||info.LatestPrice);
        const prev=parseFloat(info.PreviousClose)||price;
        if(price) return{price,change:price-prev,changePct:(price-prev)/prev*100,prevClose:prev};
      }
    }catch{}
  }
  return null;
}

async function fetchPriceUS(ticker){
  try{
    const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(ticker)}&token=${FINNHUB_KEY}`);
    const d=await r.json();if(!d.c) throw new Error();
    return{price:d.c,change:d.d,changePct:d.dp,prevClose:d.pc};
  }catch{return null;}
}

async function fetchPrice(ticker,market){
  const now=Date.now();
  if(priceCache[ticker]&&now-priceCache[ticker].ts<60000) return priceCache[ticker].data;
  const result=market==='tw'?await fetchPriceTW(ticker):await fetchPriceUS(ticker);
  if(result) priceCache[ticker]={data:result,ts:now};
  return result;
}

// HISTORY CHART
async function fetchHistory(id){
  const c=COMPANIES[id];
  if(histCache[id]) return histCache[id];
  const market=c.market;
  const ticker=c.ticker;
  let prices=[];
  try{
    if(market==='us'){
      const to=Math.floor(Date.now()/1000);
      const from=to-365*24*3600;
      const r=await fetch(`https://finnhub.io/api/v1/stock/candle?symbol=${ticker}&resolution=W&from=${from}&to=${to}&token=${FINNHUB_KEY}`);
      const d=await r.json();
      if(d.s==='ok'&&d.c){prices=d.t.map((t,i)=>({t:t*1000,p:d.c[i]}));}
    } else {
      const code=ticker.replace('.TW','').replace('.TWO','');
      const isTWO=ticker.endsWith('.TWO');
      const today=new Date();
      const dates=[];
      for(let i=11;i>=0;i--){
        const d=new Date(today.getFullYear(),today.getMonth()-i,1);
        dates.push(`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}`);
      }
      for(const ym of dates.slice(-6)){
        try{
          let url,key;
          if(!isTWO){url=`https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?date=${ym}01&stockNo=${code}&response=json`;key='data';}
          else{url=`https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes?date=${ym.slice(0,4)}-${ym.slice(4)}-01`;key=null;}
          const r=await fetch(url);const d=await r.json();
          const rows=key?d[key]:d;
          if(rows&&rows.length){
            rows.forEach(row=>{
              // BugFix: 修復 X 軸 NaN 問題，改用民國年轉西元年，並支援 TPEX 的 date
              let dtStr = isTWO ? row.Date : row[0];
              if(!dtStr) return;
              const parts = dtStr.replace(/\//g,'-').split('-');
              const closeStr = isTWO ? row.ClosingPrice : row[6];
              const close=parseFloat(String(closeStr).replace(/,/g,''));
              if(!isNaN(close)){
                const year = parseInt(parts[0]) + 1911;
                const t = new Date(year, parseInt(parts[1])-1, parseInt(parts[2])).getTime();
                prices.push({t, p:close});
              }
            });
          }
        }catch{}
      }
      // BugFix: 修復 Yahoo 備用 API 的 timestamp 讀取 (timestamp 而非 timestamps)
      if(prices.length<5){
        try{
          const sym=encodeURIComponent(ticker);
          const r=await fetch(`https://corsproxy.io/?https://query2.finance.yahoo.com/v8/finance/chart/${sym}?interval=1wk&range=1y`);
          const d=await r.json();
          const res=d?.chart?.result?.[0];
          if(res){
            const ts=res.timestamp||[];const cs=res.indicators?.quote?.[0]?.close||[];
            prices=ts.map((t,i)=>({t:t*1000,p:cs[i]})).filter(x=>x.p);
          }
        }catch{}
      }
    }
  }catch{}
  // 按照時間排序確保走勢圖正確
  prices.sort((a,b)=>a.t-b.t);
  histCache[id]=prices;
  return prices;
}

// DRAW CHART
async function drawChart(id,canvasId){
  const c=COMPANIES[id];
  const ctx=document.getElementById(canvasId);
  if(!ctx) return;
  if(chartInstances[canvasId]){chartInstances[canvasId].destroy();delete chartInstances[canvasId];}
  ctx.getContext('2d').clearRect(0,0,ctx.width,ctx.height);

  const parent=ctx.parentElement;
  let loadDiv=parent.querySelector('.chart-loading');
  if(!loadDiv){loadDiv=document.createElement('div');loadDiv.className='chart-loading';loadDiv.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;color:var(--text3)';loadDiv.textContent='載入走勢中…';parent.style.position='relative';parent.appendChild(loadDiv);}

  const hist=await fetchHistory(id);
  if(loadDiv) loadDiv.remove();

  const isUS=c.market==='us';
  const at=c.analystTarget;
  const curPriceData=priceCache[c.ticker]?.data;
  const curPrice=curPriceData?(isUS?curPriceData.price*usdTwd:curPriceData.price):null;

  let labels=[],data=[];
  if(hist.length>0){
    hist.forEach(h=>{
      const dt=new Date(h.t);
      labels.push(`${dt.getFullYear()}/${dt.getMonth()+1}`);
      data.push(isUS?+(h.p*usdTwd).toFixed(0):+h.p.toFixed(0));
    });
  } else {
    labels=['無資料'];data=[curPrice||0];
  }

  // BugFix: 修復台股預測目標價計算錯誤（不再強制乘上匯率）
  const forecastLabels=['Now','3M','6M','12M'];
  const tAvg = at ? (at.avg * (isUS ? usdTwd : 1)) : 0;
  const tMax = at ? (at.max * (isUS ? usdTwd : 1)) : 0;
  const tMin = at ? (at.min * (isUS ? usdTwd : 1)) : 0;
  
  const forecastAvg=at?[curPrice,curPrice+(tAvg-curPrice)*0.3,curPrice+(tAvg-curPrice)*0.7,tAvg].map(v=>v?+v.toFixed(0):null):[];
  const forecastMax=at?[curPrice,curPrice+(tMax-curPrice)*0.3,curPrice+(tMax-curPrice)*0.7,tMax].map(v=>v?+v.toFixed(0):null):[];
  const forecastMin=at?[curPrice,curPrice+(tMin-curPrice)*0.3,curPrice+(tMin-curPrice)*0.7,tMin].map(v=>v?+v.toFixed(0):null):[];

  const allLabels=[...labels,...forecastLabels.slice(1)];
  const nullPad=new Array(labels.length-1).fill(null);

  const datasets=[{
    label:'股價走勢',
    data:[...data,...new Array(forecastLabels.length-1).fill(null)],
    borderColor:'#378add',borderWidth:2,pointRadius:0,fill:true,
    backgroundColor:(ctx2)=>{const g=ctx2.chart.ctx.createLinearGradient(0,0,0,200);g.addColorStop(0,'rgba(55,138,221,0.15)');g.addColorStop(1,'rgba(55,138,221,0)');return g;},
    tension:0.3
  }];

  if(at&&curPrice){
    datasets.push({label:'法人目標（樂觀）',data:[...nullPad,...forecastMax],borderColor:'rgba(29,158,117,0.7)',borderWidth:1.5,borderDash:[4,3],pointRadius:0,fill:false,tension:0.3});
    datasets.push({label:'法人目標（平均）',data:[...nullPad,...forecastAvg],borderColor:'rgba(55,138,221,0.8)',borderWidth:2,borderDash:[4,3],pointRadius:4,fill:false,tension:0.3});
    datasets.push({label:'法人目標（保守）',data:[...nullPad,...forecastMin],borderColor:'rgba(226,75,74,0.7)',borderWidth:1.5,borderDash:[4,3],pointRadius:0,fill:false,tension:0.3});
  }

  chartInstances[canvasId]=new Chart(ctx,{
    type:'line',
    data:{labels:allLabels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmtNT(c.parsed.y,0)}`}}
      },
      scales:{
        x:{grid:{display:false},ticks:{color:'#aeaeb2',font:{size:9},maxTicksLimit:8}},
        y:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{color:'#aeaeb2',font:{size:9},callback:v=>'NT$'+Math.round(v/1000)+'k'}}
      }
    }
  });
}

function getSignal(id,price){
  const c=COMPANIES[id];const bearEps=c.eps2026_bear;const isUS=c.market==='us';
  const epsInTwd=isUS?bearEps*usdTwd:bearEps;
  if(!price||!epsInTwd) return null;
  const livePe=price/epsInTwd;const peAvg=c.data2025.peAvg;
  const maxP=c.data2025.maxPrice2025_twd||((c.data2025.maxPrice2025_usd||0)*usdTwd);
  const drop=maxP?(price-maxP)/maxP*100:0;
  const val=livePe<peAvg*0.85?'cheap':livePe>peAvg*1.15?'expensive':'fair';
  return{livePe,val,drop};
}

function buildCard(id){
  const c=COMPANIES[id],d=c.data2025,q=c.q1_2026,isUS=c.market==='us',bearEps=c.eps2026_bear;
  const epsInTwd=isUS?bearEps*usdTwd:bearEps;
  const eps25=isUS?fmtNT((d.eps||0)*usdTwd,0):fmtNT(d.eps_twd,2);
  const eps25s=isUS?`(${fmtUSD(d.eps)} USD)`:'';
  const maxP=isUS?fmtNT((d.maxPrice2025_usd||0)*usdTwd,0):fmtNT(d.maxPrice2025_twd,0);

  const hist=c.epsHistory||[];
  const histTwd=hist.map(h=>({...h,vt:isUS?h.v*usdTwd:h.v}));
  const maxV=Math.max(...histTwd.map(h=>Math.abs(h.vt)))*1.2||1;
  const chartHtml=histTwd.map(h=>`<div class="eps-bc"><div class="eps-bv">${Math.abs(h.vt)<100?h.vt.toFixed(0):Math.round(h.vt/100)+'h'}</div><div class="eps-bf${h.proj?' proj':h.proj2?' proj2':''}" style="height:${(Math.max(h.vt,0)/maxV*65).toFixed(0)}px"></div><div class="eps-by">${h.yr}</div></div>`).join('');

  const entries=Object.entries(q.revenue||{});
  const monthHtml=entries.length&&entries.some(([,v])=>v)?'<div class="mgrid">'+entries.map(([m,v])=>`<div class="mcell"><div class="mm">${m}</div><div class="mv">${v||'—'}</div></div>`).join('')+'</div>':`<p style="font-size:12px;color:var(--text3);padding:4px 0">${q.totalLabel||'月度按季公告'}</p>`;
  const totalHtml=q.total?`<div class="total-bar"><span class="tl">Q1 2026 累計</span><span class="tv">${q.total}</span></div>`:'';

  const at=c.analystTarget;
  const atMax=isUS?fmtUSD(at.max):fmtNT(at.max);
  const atAvg=isUS?fmtUSD(at.avg):fmtNT(at.avg);
  const atMin=isUS?fmtUSD(at.min):fmtNT(at.min);
  const totalRating=at.strongBuy+at.buy+at.hold+at.sell;

  const isUS=c.market==='us';const twdP=isUS?pd.price*usdTwd:pd.price;
  const chg=pd.changePct||0;const chgStr=(chg>=0?'+':'')+chg.toFixed(2)+'%';const cls=chg>=0?'up':'dn';
  const sig=getSignal(id,twdP);
  let sigHtml='';
  if(sig){
    sigHtml+=sig.val==='cheap'?`<span class="signal cheap">💚 便宜 PE ${sig.livePe.toFixed(1)}x</span>`:sig.val==='expensive'?`<span class="signal expensive">🔴 偏貴 PE ${sig.livePe.toFixed(1)}x</span>`:`<span class="signal fair">🟡 合理 PE ${sig.livePe.toFixed(1)}x</span>`;
    if(sig.drop<=-20) sigHtml+=` <span class="signal watch">⚠️ 距高點跌${Math.abs(sig.drop).toFixed(0)}%</span>`;
  }
  let html=`<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="live-price">${fmtNT(twdP,0)}</span>`;
  if(isUS) html+=`<span style="font-size:11px;color:var(--text3)">(${fmtUSD(pd.price)})</span>`;
  html+=`<span class="price-chg ${cls}">${chgStr}</span></div>`;
  if(sigHtml) html+=`<div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap">${sigHtml}</div>`;
  el.innerHTML=html;
  const epsInTwd=isUS?c.eps2026_bear*usdTwd:c.eps2026_bear;
  c.peRows.forEach(pe=>{const row=document.getElementById(`pe-row-${id}-${pe}`);if(!row) return;Math.abs(pe-twdP/epsInTwd)<2.5?row.classList.add('cur'):row.classList.remove('cur');});

  drawChart(id,`chart-${id}`);
}

// GAME LOGIC
let gameLoop, gameActive=false;
let player, bullets, enemies, score, frameCount=0;
function initGame() {
  if(gameActive) return;
  const cvs = document.getElementById('game-canvas');
  cvs.width = cvs.offsetWidth || 350;
  cvs.height = cvs.offsetHeight || 350;

  if (!cvs.dataset.bound) {
    cvs.addEventListener('touchmove', e => {
      if(!gameActive) return;
      e.preventDefault();
      const rect = cvs.getBoundingClientRect();
      const scaleX = cvs.width / rect.width;
      player.x = (e.touches[0].clientX - rect.left) * scaleX - player.w/2;
      player.x = Math.max(0, Math.min(cvs.width - player.w, player.x));
    }, {passive: false});
    cvs.addEventListener('mousemove', e => {
      if(!gameActive) return;
      const rect = cvs.getBoundingClientRect();
      const scaleX = cvs.width / rect.width;
      player.x = (e.clientX - rect.left) * scaleX - player.w/2;
      player.x = Math.max(0, Math.min(cvs.width - player.w, player.x));
    });
    cvs.dataset.bound = "true";
  }
}

window.startGame = function() {
  if(gameActive) return;
  const cvs = document.getElementById('game-canvas');
  const gctx = cvs.getContext('2d');
  gameActive = true;
  player = {x: cvs.width/2 - 15, y: cvs.height - 40, w: 30, h: 30};
  bullets = [];
  enemies = [];
  score = 0;
  frameCount = 0;
  document.getElementById('game-score').textContent = 'Score: 0';
  document.getElementById('game-btn').style.display = 'none';

  function update() {
    if(!gameActive) return;
    gctx.clearRect(0, 0, cvs.width, cvs.height);

    // 繪製玩家 (綠色三角形)
    gctx.fillStyle = '#1d9e75';
    gctx.beginPath();
    gctx.moveTo(player.x + player.w/2, player.y);
    gctx.lineTo(player.x + player.w, player.y + player.h);
    gctx.lineTo(player.x, player.y + player.h);
    gctx.fill();

    frameCount++;
    if(frameCount % 12 === 0) bullets.push({x: player.x + player.w/2 - 2, y: player.y, w: 4, h: 10});
    if(frameCount % 45 === 0) enemies.push({x: Math.random() * (cvs.width - 20), y: -20, w: 20, h: 20, speed: 1.5 + Math.random()*2.5});

    gctx.fillStyle = '#fff';
    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.y -= 7;
      gctx.fillRect(b.x, b.y, b.w, b.h);
      if(b.y < 0) bullets.splice(i, 1);
    }

    gctx.fillStyle = '#e24b4a'; // 紅色空頭方塊
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      e.y += e.speed;
      gctx.fillRect(e.x, e.y, e.w, e.h);

      // 玩家碰撞判定
      if(e.x < player.x + player.w && e.x + e.w > player.x && e.y < player.y + player.h && e.y + e.h > player.y) {
        gameActive = false;
        document.getElementById('game-btn').style.display = 'inline-block';
        document.getElementById('game-btn').textContent = '重新挑戰';
      } else {
        // 子彈碰撞判定
        let hit = false;
        for (let j = bullets.length - 1; j >= 0; j--) {
          let b = bullets[j];
          if(b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            score += 10;
            document.getElementById('game-score').textContent = 'Score: ' + score;
            hit = true;
            break;
          }
        }
        if(!hit && e.y > cvs.height) enemies.splice(i, 1);
      }
    }
    if(gameActive) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

async function refresh(){
  await fetchRate();
  if(currentTab==='analyze') selected.forEach(id=>updateCardPrice(id));
  else if(currentTab==='portfolio') renderPortfolio();
}

(async()=>{renderPicker();populateStockSelects();await fetchRate();selectCompany('PHISON');})();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
